<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فحص OCR محلي — أداة تطوير</title>
<style>
  body { font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; max-width: 780px; margin: 2rem auto; padding: 0 1rem; background: #f6f3ec; color: #222; }
  textarea { width: 100%; min-height: 6rem; font-family: 'Amiri', serif; font-size: 1.25rem; padding: .5rem; box-sizing: border-box; }
  button { font: inherit; padding: .4rem 1.2rem; margin: .5rem 0 1rem; cursor: pointer; }
  #out { white-space: pre-wrap; background: #fff; border: 1px solid #ccc; border-radius: 6px; padding: 1rem; font-family: 'Amiri', serif; font-size: 1.1rem; }
  .note { color: #666; font-size: .85rem; }
</style>
</head><body>
<h1>فحص المحرك المحلي (Tesseract — مستضاف ذاتيًا)</h1>
<p class="note">صفحة أدوات للتطوير فقط: غير مرتبطة بواجهة التطبيق. النص يُرسم على لوحة ثم يُقرأ، مع عرض الزمن وCER.</p>
<label for="txt">النص المعروف:</label>
<textarea id="txt" dir="rtl">قال المعلم للطلاب إن العلم نور يضيء طريق الحياة، وإن القراءة باب واسع يدخل منه العاقل إلى المعرفة والفهم.</textarea>
<button id="go">ارسم واقرأ</button>
<div id="out">بانتظار التشغيل…</div>
<script type="module" src="/src/ocr-check.js"></script>
</body></html>
