name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  smoke:
    name: smoke + AI failure e2e
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: echo "CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      - name: Start Vite
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          echo $! > /tmp/vite.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          if ! curl -sf http://127.0.0.1:5173/ > /dev/null; then cat /tmp/vite.log; exit 1; fi
      - name: Smoke
        run: node tests/e2e/smoke.mjs http://127.0.0.1:5173/
      - name: AI failure paths
        run: node tests/e2e/ai-failure.mjs http://127.0.0.1:5173/
      - name: Stop Vite
        if: always()
        run: |
          if [ -f /tmp/vite.pid ]; then kill "$(cat /tmp/vite.pid)" || true; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vite-log
          path: /tmp/vite.log
          if-no-files-found: ignore
          retention-days: 7
