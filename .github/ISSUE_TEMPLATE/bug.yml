name: Bug report
description: Something is broken or behaves unexpectedly
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Do not include a real API key, book text, or library export.
        For security problems, use SECURITY.md instead of a public issue.
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Output of `git rev-parse --short HEAD`, or the release version.
      placeholder: e.g. 0.1.0 or 48d2b88
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Build
      options:
        - Vite dev server
        - dist/web
        - dist/single (file)
        - other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and OS
      placeholder: Chrome 140 / Windows 11; iPhone Safari 18
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps. Use a synthetic book if possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console output (optional)
      description: Remove API keys, book text, and personal data first.
      render: shell
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed API keys, books, exports, and personal data from this report.
          required: true
